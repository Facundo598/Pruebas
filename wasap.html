<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Envío WhatsApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #128C7E;
            font-size: 22px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Enviar mensaje por WhatsApp</h2>
    
    <div class="campo">
        <label for="telefono">Número de WhatsApp:</label>
        <input type="tel" id="telefono" placeholder="Ej: 5493871234567" value="549">
        <small style="color: #666; font-size: 11px;">Incluir código de país y área (sin espacios ni del signo +).</small>
    </div>

    <div class="campo">
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" placeholder="Escribe el mensaje aquí...">Hola, adjunto el enlace a tu orden de consulta: https://drive.google.com/file/d/EJEMPLO_PDF/view</textarea>
    </div>

    <button onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
</div>

<script>
    function enviarWhatsApp() {
        const telefono = document.getElementById('telefono').value.replace(/\D/g, ''); // Limpia caracteres no numéricos
        const mensaje = document.getElementById('mensaje').value;

        if (!telefono) {
            alert("Por favor ingrese un número de teléfono válido.");
            return;
        }

        // encodeURIComponent codifica los espacios y caracteres especiales para URL
        const mensajeCodificado = encodeURIComponent(mensaje);
        
        // Construcción de la URL de WhatsApp
        const urlWhatsApp = `https://wa.me/${telefono}?text=${mensajeCodificado}`;

        // Abre WhatsApp Web o la App en una pestaña nueva
        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
