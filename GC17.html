<!DOCTYPE html>
<html>
<head>
    <style>
      body {
        background: linear-gradient(135deg, #5E5D5D 20%, #2756BA 80%);
        background-attachment: fixed; min-height: 100vh; margin: 0; padding: 0; }
      #seccionGestion { padding: 20px; background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px); margin: 20px auto; border-radius: 20px;
        width: 90%; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        /* Estilos de la tabla */
        table { width: 100%; border-collapse: separate; font-family: 'Segoe UI', sans-serif; border-spacing: 10px; }
        th { background: rgba(29, 88, 222, 0.3); padding: 12px; text-align: left;font-size: 20px; }
        th:first-child { border-top-left-radius: 15px; border-bottom-left-radius: 15px; }
        th:last-child { border-top-right-radius: 15px; border-bottom-right-radius: 15px; }
      	td { padding: 4px; border-bottom: 1px solid #ddd; vertical-align: top; border-bottom: 1px solid #4a4a4a;}
        .paciente-nombre { font-size: 17px; font-weight: bold; color: #2b6cb0; margin: 0 0 4px 0; }
        .fecha-info { font-size: 17px; margin-bottom: 3px; }
        .detalles-linea { font-size: 17px; }
        .prestador-info { font-weight: bold; color: #0056b3; margin-bottom: 5px; }
        .orden-info { font-weight: 600; color: #0056b3; margin-bottom: 5px; }
        .acciones-contenedor { display: flex; flex-direction: column; gap: 5px; }
        .btn-accion { padding: 8px; cursor: pointer; border: none; border-radius: 4px; font-size: 20px; }
        .btn-gestionar { background: #5ECC7A; }
        .btn-concluir { background: #dc3545; color: white; }
        .btn-enlace { display: inline-block; padding: 5px 10px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; font-size: 0.8em; }

        /* ESTILOS DEL MODAL (Tarjeta Profesional) */
        .modal-fondo { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .card-modal { background: white; width: 350px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-family: sans-serif; }
        .header { background: #f1f3f5; padding: 15px; font-weight: bold; border-bottom: 1px solid #ddd; }
        .body { padding: 25px; text-align: center; color: #555; }
        .footer { padding: 15px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; }
        .btn-cerrar { background: #e9ecef; color: #333; padding: 8px 15px; border-radius: 6px; cursor: pointer; border: none; }
        .btn-aceptar { background: #28a745; color: white; padding: 8px 15px; border-radius: 6px; 
        	cursor: pointer; border: none; }
    	.container-login { height: 100vh; display: flex; justify-content: center; align-items: center;
	    	background: linear-gradient(135deg, #5E5D5D 20%, #2756BA 80%);}
      	.glass-card { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px); padding: 40px; 
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 50px 20px 0 rgba(0, 0, 0, 0.37); width: 350px; text-align: center; color: white;}
      	.input-group { display: flex; flex-direction: row; align-items: center; gap: 10px; }
        input { width: 100%; padding: 12px 15px; background: rgba(255, 255, 255, 0.05); font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: white; outline: none;}
        button.btn-login { width: 100%; padding: 12px; background: white; color: #801DE2; border: none; 
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.8s;font-size: 18px;}
      	/* ESTILOS LOGIN MICAM */
        .contenedor-externo {width: 100%; background: rgba(255, 255, 255, 0.5); border-radius: 20px;}
        .contenedor-externo input {border: 1.6px solid #4a4a4a; max-width: 200px;}
        .input-group label {color: #2b6cb0; font-size: 20px; font-weight: bold; }
      	.tabla-sin-bordes td {border-bottom: none !important; }
      	/* ESTILOS DEL VISOR DE COMPROBANTES CON ZOOM */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        	background-color: rgba(0, 0, 0, 0.85); display: flex; justify-content: center;
          	align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
          	overflow: hidden; z-index: 2000; }
        .modal-overlay.activo { opacity: 1; pointer-events: auto; }
        .modal-wrapper { position: relative; width: 90%; height: 90%; display: flex;
			justify-content: center; align-items: center; }
        .modal-wrapper img { max-width: 100%; max-height: 80vh; border-radius: 8px; display: block;
          	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); cursor: grab; user-select: none;
          	will-change: transform; }
        .modal-wrapper img:active { cursor: grabbing;}
        .btn-cerrar-visor { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
          	background-color: #ffffff; color: #333333; border: none; border-radius: 50%;
          	font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
          	display: flex; align-items: center; justify-content: center; z-index: 10; }
        .btn-cerrar-visor:hover { background-color: #f3f4f6; }
        .zoom-info { position: absolute; bottom: 10px; color: rgba(255, 255, 255, 0.7);
          	font-size: 13px; pointer-events: none; }

    </style>
</head>
<body>
  
    <div id="seccionLogin" class="container-login" style="display: none;">
        <div style="margin-bottom: 20px;" class="glass-card">
            <h1>OSFATLYF - SALTA</h1>
            <div style="margin-bottom: 20px;" class="input-group">
                <input type="text" id="user" placeholder="Usuario" value="admin">
            </div>
            <div style="margin-bottom: 20px;" class="input-group">
                <input type="password" id="pass" placeholder="Contraseña" value="Salta2026*">
            </div>
            <button class="btn-login" onclick="cargarDatos()">INGRESAR</button>
            <div id="msgBusqueda" style="margin-top: 15px; font-weight: bold; font-size: 20px;"></div>
        </div>
    </div>

    <!-- BARRA EXTERNA (Oculta por defecto) -->
    <div id="barra-externa" style="display: none; text-align: center; margin-top: 30px; color: white; font-family: sans-serif;">
        <h1>OSFATLYF - SALTA</h1>

        <div class="contenedor-externo" style="width: 90%; margin: 0 auto; padding: 5px;">
            <table class="tabla-sin-bordes" style="width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 5px;">
                <tr>
                    <td style="width: 40%;"> <div class="input-group">
                            <label>Usuario:</label>
                            <input type="text" id="ext-usuario"> </div> </td>
                    <td style="width: 40%;"> <div class="input-group">
                            <label>Contraseña:</label>
                            <input type="password" id="ext-password"> </div> </td>
                    <td style="width: 20%; vertical-align: middle;">
                        <button type="button" id="btn-iniciar-logueo" class="btn-login" style="width: 100%; padding: 7px;">
                            MICAM </button> </td>
                </tr>
            </table>
        </div>
    </div>

<!-- PANTALLA 2: GESTIÓN -->
<div id="seccionGestion" style="display: none; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">Gestión de Consultas</h1>
		<div id="avisoNuevosDatos" 
             style="background: transparent; color: #fff; border: 2px dashed rgba(255,255,255,0.4); padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; transition: all 0.3s ease; cursor: default;" 
             onclick="clicBotonActualizar()">
            🔄 Todo al día
        </div>
        <button onclick="cerrarSesion()" style="padding: 8px 15px; cursor: pointer; background: #6c757d; color: white; border: none; border-radius: 6px; font-size: 16px;">
            Cerrar Sesión
        </button>
    </div>   
  
    <table id="tabla-consultas">
        <thead> 
            <tr>
                <th style="width: 40%;">Datos del Beneficiario</th>
                <th style="width: 40%;">Orden / Prestador</th>
                <th style="width: 20%;">Acciones</th> 
            </tr> 
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>
</div>

    <!-- MODAL -->
    <div id="miModal" class="modal-fondo">
        <div class="card-modal">
            <div class="header">📋 Confirmar Conclusión</div>
            <div class="body"> <p id="textoModal">¿Deseas concluir la orden?</p> </div>
            <div class="footer">
                <button class="btn-cerrar" onclick="cerrarModal()">Cancelar</button>
                <button id="btnAceptar" class="btn-aceptar">Aceptar</button>
            </div>
        </div>
    </div>
  
    <!-- VISOR DE COMPROBANTES CON ZOOM -->
    <div class="modal-overlay" id="modalVisorOverlay">
      <div class="modal-wrapper">
        <button class="btn-cerrar-visor" id="btnCerrarVisor">&times;</button>
        <img id="imagenZoomComprobante" src="" alt="Comprobante de Transferencia">
        <div class="zoom-info">Usa la rueda del ratón para Zoom y arrastra para mover</div>
      </div>
    </div>
  
<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxvc6Lm4SWvLleZ-ReQR3QIQoD4Yq2F3jqwVg1DVShsf9RWNkpRs4CY8I0TyDCvi-zC/exec";
    let datosPendientes = { fila: null, e: null };
    let cantidadRegistrosActuales = 0;
    let temporizadorVerificacion = null;
	let estaActualizando = false;

    window.onload = function() {
        const usuarioGuardado = localStorage.getItem('usuario');
        const passwordGuardado = localStorage.getItem('password');
        if (usuarioGuardado && passwordGuardado) {
            document.getElementById('user').value = usuarioGuardado;
            document.getElementById('pass').value = passwordGuardado;
            document.getElementById('seccionLogin').style.display = 'none';
            document.getElementById('barra-externa').style.display = 'block';
            document.getElementById('seccionGestion').style.display = 'block';
            cargarDatos(); 
        } else { document.getElementById('seccionLogin').style.display = 'flex'; }
    };

    async function cargarDatos() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        const btnLogin = document.querySelector('.btn-login'); 
        const msgBusqueda = document.getElementById('msgBusqueda');
        msgBusqueda.innerHTML = ""; 
        if (btnLogin) { btnLogin.disabled = true; btnLogin.innerText = "Verificando..."; }
        try {
            const res = await fetch(`${URL_API}?action=obtenerSolicitudes&usuario=${user}&password=${pass}`);
            const data = await res.json();
            if (!data.ok) { msgBusqueda.innerHTML = "Usuario o contraseña incorrectos"; return; }
            cantidadRegistrosActuales = data.datos ? data.datos.length : 0;
            const botonAlerta = document.getElementById('avisoNuevosDatos');
            if (botonAlerta) { botonAlerta.style.pointerEvents = 'none'; }
            localStorage.setItem('usuario', user);
            localStorage.setItem('password', pass);
            document.getElementById('barra-externa').style.display = 'block';
            document.getElementById('seccionLogin').style.display = 'none';
            document.getElementById('seccionGestion').style.display = 'block';
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = "";

            if (!data.datos || data.datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 30px; color: #607DAB; font-size: 20px;">
                    <strong>No existen solicitudes pendientes. ¡Buen trabajo, todo está al día!</strong>
                </td></tr>`; 
                return;
            }
        
            data.datos.forEach(item => {
                const tr = document.createElement('tr');
                tr.dataset.dni = item.dni || '';
                tr.dataset.nombre = item.nombre || '';
                tr.dataset.ordennombre = item.ordenNombre || '';
                tr.dataset.precio = item.precio || '';
                tr.dataset.prestador = item.prestador || '';
                tr.dataset.metodopago = item.metodoPago || '';
                tr.innerHTML = `
                    <td>
                        <div class="fecha-info">📅 ${item.fecha || 'Sin fecha'}</div>
                        <p class="paciente-nombre">${item.nombre}</p>
                        <div class="detalles-linea"><strong>DNI:</strong> ${item.dni}</div>
                        <div class="detalles-linea"><strong>Recepción:</strong> ${item.recepcion || 'No especificada'}</div>
                        <div class="detalles-linea"><strong>Contacto:</strong> ${item.contacto || 'No especificado'}</div>
                    </td>
                    <td>
                        <div class="prestador-info">🏢 ${item.prestador}</div>
                        <div class="orden-info">📋 ${item.ordenNombre || ''}</div>
                        <div class="detalles-linea"><strong>Precio:</strong> $${item.precio}</div>
                        <div class="detalles-linea"><strong>Método de Pago:</strong> ${item.metodoPago || ''}</div>
                        
                        ${item.urlComprobante && item.urlComprobante !== 'No aplica' ? `
                            <div style="margin-top: 8px;">
                                <button type="button" class="btn-enlace" style="background: #2b6cb0; font-weight: bold; border: none; cursor: pointer;" onclick="abrirVisorComprobante('${item.urlComprobante}')">
                                    📎 Transferencia
                                </button>
                            </div>
                        ` : ''}
                    </td>
                    <td>
                        <div class="acciones-contenedor">
                            <button class="btn-accion btn-gestionar">Gestionar</button>
                            <button class="btn-accion btn-concluir">Concluir</button>
                        </div>
                    </td>`;
            
                tr.querySelector('.btn-concluir').addEventListener('click', (e) => {
                    datosPendientes = { fila: item.filaIndex, e: e };
                    document.getElementById('textoModal').innerText = `¿Seguro que deseas concluir la orden de ${item.nombre}?`;
                    document.getElementById('miModal').style.display = 'flex';
                });
                
                tbody.appendChild(tr);
            });
        } catch (err) { console.error(err);  msgBusqueda.innerHTML = "Error de conexión al servidor.";
        } finally { if (btnLogin) { btnLogin.disabled = false; btnLogin.innerText = "INGRESAR"; }
        }
    }

    function cerrarModal() { document.getElementById('miModal').style.display = 'none'; }   
    document.getElementById('btnAceptar').addEventListener('click', async (event) => {
        const btnAceptar = event.currentTarget;
        const { fila } = datosPendientes;
        const usuarioVal = document.getElementById('user').value;
        const passwordVal = document.getElementById('pass').value;
  		const gestorVal = document.getElementById('ext-usuario').value;
        btnAceptar.disabled = true;
        btnAceptar.innerText = "Enviando...";
  		const params = new URLSearchParams({ action: "concluir", filaIndex: fila, usuario: usuarioVal, 
        password: passwordVal, gestor: gestorVal });
        try {
            const res = await fetch(URL_API, { method: "POST", body: params });
            const result = await res.json();
            if (result.ok) { 
                cerrarModal(); 
                document.getElementById('cuerpoTabla').innerHTML = ""; 
                await cargarDatos();
            } else { alert("Error al concluir: " + result.error); }
        } catch (err) { console.error(err);  alert("Error de conexión al servidor.");
        } finally { btnAceptar.disabled = false; btnAceptar.innerText = "Aceptar"; }
    });

    function cerrarSesion() { localStorage.removeItem('usuario'); localStorage.removeItem('password'); location.reload(); }
            
    // --- LÓGICA DEL VISOR DE COMPROBANTES CON ZOOM ---
    const modalVisorOverlay = document.getElementById('modalVisorOverlay');
    const btnCerrarVisor = document.getElementById('btnCerrarVisor');
    const imgZoomComprobante = document.getElementById('imagenZoomComprobante');
    let escala = 1, posX = 0, posY = 0, estaArrastrando = false, inicioX = 0, inicioY = 0;
    function actualizarTransformacionComprobante() { imgZoomComprobante.style.transform = `translate(${posX}px, ${posY}px) scale(${escala})`; }
    function resetearVistaComprobante() { escala = 1; posX = 0; posY = 0; actualizarTransformacionComprobante(); }

    function abrirVisorComprobante(url) { 
        let urlDirecta = url;
        if (url.includes('drive.google.com')) {
            const match = url.match(/(?:\/d\/|id=)([a-zA-Z0-9_-]+)/);
            if (match && match[1]) { urlDirecta = `https://lh3.googleusercontent.com/d/${match[1]}`; }
        }
        imgZoomComprobante.src = urlDirecta;
        resetearVistaComprobante();
        modalVisorOverlay.classList.add('activo');
    }

    const cerrarVisorComprobante = () => { modalVisorOverlay.classList.remove('activo'); resetearVistaComprobante(); imgZoomComprobante.src = ''; };
    btnCerrarVisor.addEventListener('click', cerrarVisorComprobante);
    modalVisorOverlay.addEventListener('click', (e) => { if (e.target === modalVisorOverlay) cerrarVisorComprobante(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalVisorOverlay.classList.contains('activo')) cerrarVisorComprobante(); });

    // Zoom con el scroll del ratón
    modalVisorOverlay.addEventListener('wheel', (e) => {
        if (!modalVisorOverlay.classList.contains('activo')) return;
        e.preventDefault();
        const factorZoom = 0.15;
        if (e.deltaY < 0) { escala = Math.min(escala + factorZoom, 5); } 
        else { escala = Math.max(escala - factorZoom, 1); if (escala === 1) { posX = 0; posY = 0; } }
        actualizarTransformacionComprobante();
    }, { passive: false });
        
    // Arrastre (Panning) al hacer zoom
    imgZoomComprobante.addEventListener('mousedown', (e) => { if (escala === 1) return; e.preventDefault(); 
		estaArrastrando = true; inicioX = e.clientX - posX; inicioY = e.clientY - posY; });
    window.addEventListener('mousemove', (e) => { if (!estaArrastrando) return; posX = e.clientX - inicioX; 
		posY = e.clientY - inicioY; actualizarTransformacionComprobante(); });
    window.addEventListener('mouseup', () => { estaArrastrando = false; });

    // Función silenciosa que verifica si hay cambios
    async function verificarNuevosDatos() {
        const usuarioVal = localStorage.getItem('usuario');
        const passwordVal = localStorage.getItem('password');
        if (!usuarioVal || !passwordVal || estaActualizando) return;     
        try {
            const res = await fetch(`${URL_API}?action=obtenerSolicitudes&usuario=${usuarioVal}&password=${passwordVal}`);
            const data = await res.json();
            if (data.ok && data.datos) {
                const nuevaCantidad = data.datos.length;
                if (cantidadRegistrosActuales === 0) { cantidadRegistrosActuales = nuevaCantidad; } 
                else if (nuevaCantidad !== cantidadRegistrosActuales) {
                    const botonAlerta = document.getElementById('avisoNuevosDatos');
                    if (botonAlerta) {
                        botonAlerta.style.background = '#F5A83D'; botonAlerta.style.color = '#333';
                        botonAlerta.style.border = '2px solid #ffc107'; botonAlerta.innerHTML = "🔔 ¡Nuevas solicitudes!";
                        botonAlerta.style.pointerEvents = 'auto'; botonAlerta.style.cursor = 'pointer';
                        if (temporizadorVerificacion) { clearInterval(temporizadorVerificacion); temporizadorVerificacion = null; }
                    }
                }
            }
        } catch (err) { console.log("Verificación en segundo plano pausada temporalmente."); }
    }
   
    // Función que se ejecuta cuando el usuario hace clic en el botón de alerta
    async function clicBotonActualizar() {
        if (estaActualizando) return;
        estaActualizando = true;
        const botonAlerta = document.getElementById('avisoNuevosDatos');
        botonAlerta.style.background = '#6c757d'; 
        botonAlerta.style.color = '#fff';
        botonAlerta.innerHTML = "⏳ Actualizando...";   
        await cargarDatos();
        botonAlerta.style.background = 'transparent';
        botonAlerta.style.color = '#fff';
        botonAlerta.style.border = '2px dashed rgba(255,255,255,0.4)';
        botonAlerta.innerHTML = "🔄 Todo al día";
        estaActualizando = false;
        iniciarTemporizador();
    }

    function iniciarTemporizador() {
        if (temporizadorVerificacion) clearInterval(temporizadorVerificacion);
        temporizadorVerificacion = setInterval(verificarNuevosDatos, 60000);
    }

    iniciarTemporizador();
</script>
</body>
</html>
